<!DOCTYPE html>
<html lang="ru"><head>
<meta charset="utf-8">
<title>Словарь LingvoBuddy</title>
<script src="2d23efa8-f324-417e-aaa1-30f376afdfa0"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,sans-serif}
a{color:#64D2FF}a:hover{color:#9BE3FF}
button,input{font-family:inherit}
</style>
</helmet>
<div style="width: 1120px; height: 720px; box-sizing: border-box; padding: 30px; background: #33404D; color: #F5F5F7">
<div style="width: 1060px; height: 660px; display: flex; flex-direction: column; background: #1E1E20; border: 1px solid rgba(255,255,255,0.10); border-radius: 12px; box-shadow: 0 18px 50px rgba(0,0,0,0.45); overflow: hidden">
<div style="height: 52px; display: flex; align-items: center; gap: 14px; padding: 0 16px; border-bottom: 1px solid #3A3A3C; background: #232325">
<div style="display: flex; gap: 8px" aria-hidden="true">
<span style="width: 12px; height: 12px; border-radius: 6px; background: #FF5F57"></span>
<span style="width: 12px; height: 12px; border-radius: 6px; background: #FEBC2E"></span>
<span style="width: 12px; height: 12px; border-radius: 6px; background: #28C840"></span>
</div>
<div style="font-size: 14px; font-weight: 600; flex: 1">Словарь</div>
<label for="s" style="position: absolute; left: -9999px">Поиск</label>
<input id="s" placeholder="Поиск слова или перевода" style="width: 260px; height: 30px; box-sizing: border-box; padding: 0 10px; border-radius: 7px; border: 1px solid #3A3A3C; background: #141416; color: #F5F5F7; font-size: 13px">
<button style="height: 30px; padding: 0 12px; border-radius: 7px; border: 0; background: #0A84FF; color: #FFFFFF; font-size: 13px; font-weight: 600; cursor: pointer">+ Слово</button>
</div>

<div style="flex: 1; display: flex; min-height: 0">
<div style="width: 220px; flex-shrink: 0; box-sizing: border-box; padding: 12px 10px; display: flex; flex-direction: column; gap: 2px; border-right: 1px solid #3A3A3C; background: #1A1A1C; font-size: 13px">
<span style="padding: 6px 8px; font-size: 11px; color: #A1A1A6; font-weight: 600">СПИСКИ</span>
<a href="#" style="display: flex; justify-content: space-between; padding: 7px 8px; border-radius: 6px; background: rgba(10,132,255,0.22); color: #FFFFFF; text-decoration: none"><span>Изучаю</span><span>38</span></a>
<a href="#" style="display: flex; justify-content: space-between; padding: 7px 8px; border-radius: 6px; color: #D1D1D6; text-decoration: none"><span>Выученные</span><span style="color: #A1A1A6">214</span></a>
<a href="#" style="display: flex; justify-content: space-between; padding: 7px 8px; border-radius: 6px; color: #D1D1D6; text-decoration: none"><span>Мои слова</span><span style="color: #A1A1A6">12</span></a>
<a href="#" style="display: flex; justify-content: space-between; padding: 7px 8px; border-radius: 6px; color: #D1D1D6; text-decoration: none"><span>Очередь топ‑1000</span><span style="color: #A1A1A6">748</span></a>
<span style="padding: 14px 8px 6px; font-size: 11px; color: #A1A1A6; font-weight: 600">ПРАВИЛА</span>
<div style="display: flex; flex-direction: column; gap: 8px; padding: 4px 8px; font-size: 12px; color: #D1D1D6">
<div style="display: flex; justify-content: space-between"><span>Интервал</span><span style="color: #A1A1A6">15 мин</span></div>
<div style="display: flex; justify-content: space-between"><span>Выучено после</span><span style="color: #A1A1A6">4 верно подряд</span></div>
<div style="display: flex; justify-content: space-between"><span>Повторения</span><span style="color: #A1A1A6">20% карточек</span></div>
<div style="display: flex; justify-content: space-between"><span>Тихие часы</span><span style="color: #A1A1A6">23:00–9:00</span></div>
<div style="display: flex; justify-content: space-between"><span>Направление</span><span style="color: #A1A1A6">EN → RU</span></div>
</div>
</div>

<div style="flex: 1; min-width: 0; display: flex; flex-direction: column">
<div style="display: grid; grid-template-columns: 2fr 2fr 1.4fr 1.2fr 1fr; gap: 12px; padding: 10px 20px; font-size: 11px; font-weight: 600; color: #A1A1A6; border-bottom: 1px solid #3A3A3C">
<span>СЛОВО</span><span>ПЕРЕВОД</span><span>ОСВОЕНИЕ</span><span>ПОСЛЕДНИЙ ОТВЕТ</span><span>ИСТОЧНИК</span>
</div>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="10">
<div style="display: grid; grid-template-columns: 2fr 2fr 1.4fr 1.2fr 1fr; gap: 12px; align-items: center; height: 44px; padding: 0 20px; font-size: 13px; border-bottom: 1px solid #2A2A2C">
<span style="font-weight: 600">{{r.word}}</span>
<span style="color: #D1D1D6">{{r.tr}}</span>
<span style="display: flex; gap: 4px; align-items: center">
<sc-for list="{{r.dots}}" as="d" hint-placeholder-count="4"><span style="{{d}}"></span></sc-for>
</span>
<span style="color: {{r.lastColor}}">{{r.last}}</span>
<span style="color: #A1A1A6">{{r.src}}</span>
</div>
</sc-for>
</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:1120,&quot;height&quot;:720}}">
class Component extends DCLogic {
  renderVals() {
    const data = [
      ['although', 'хотя', 2, 'верно · 12 мин', 'ok', '№312'],
      ['enough', 'достаточно', 3, 'верно · 1 ч', 'ok', '№188'],
      ['suggest', 'предлагать', 0, 'ошибка · вчера', 'bad', 'моё'],
      ['reluctant', 'неохотный', 0, 'ещё не было', 'none', 'моё'],
      ['provide', 'обеспечивать', 1, 'верно · 3 ч', 'ok', '№254'],
      ['whether', 'ли (будет ли)', 1, 'ошибка · 2 ч', 'bad', '№330'],
      ['however', 'однако', 3, 'верно · вчера', 'ok', '№205'],
      ['likely', 'вероятно', 2, 'верно · 40 мин', 'ok', '№402'],
      ['require', 'требовать', 1, 'верно · сегодня', 'ok', '№441'],
      ['eventually', 'в конце концов', 0, 'ошибка · сегодня', 'bad', 'моё']
    ];
    const colors = { ok: '#30D158', bad: '#FFB340', none: '#A1A1A6' };
    const rows = data.map((d) => ({
      word: d[0], tr: d[1], last: d[3], lastColor: colors[d[4]], src: d[5],
      dots: [0, 1, 2, 3].map((k) => 'width:8px;height:8px;border-radius:4px;background:' + (k < d[2] ? '#0A84FF' : '#3A3A3C'))
    }));
    return { rows };
  }
}
</script>


</body></html>
