name: Release

# A tag push `vX.Y.Z` publishes a Release with the signed disk image and its appcast. A manual run
# only uploads both as a workflow artifact, to test the pipeline without a Release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Read-only by default: the build job runs third-party actions and must not hold a write token
# or a secret. Only the sign job holds the certificate and the EdDSA key, and only the publish
# job, which runs no third-party code, can write the Release.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # GRDB 7.11 needs swift-tools 6.1 (Xcode 16.3 or later).
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: LingvoCore/.build
          key: spm-${{ runner.os }}-${{ hashFiles('LingvoCore/Package.resolved') }}
      - name: Version
        id: version
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = push ]; then
            version="${GITHUB_REF_NAME#v}"
            # Fail before the long build: the version goes into CFBundleShortVersionString.
            if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Tag $GITHUB_REF_NAME is not vX.Y.Z"
              exit 1
            fi
          else
            version="0.0.0-dev.$GITHUB_RUN_NUMBER"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: brew install xcodegen swiftlint ruff
      - run: make check
      - run: make release-app VERSION="$VERSION" BUILD_NUMBER="$GITHUB_RUN_NUMBER"
        env:
          VERSION: ${{ steps.version.outputs.version }}
      # An artifact loses the executable bit and the symlinks of a bundle: a tar keeps them.
      - run: tar -C build/DerivedData/Build/Products/Release -cf build/LingvoBuddy-app.tar LingvoBuddy.app
      - name: Upload the unsigned app
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: LingvoBuddy-app-${{ steps.version.outputs.version }}
          path: build/LingvoBuddy-app.tar
          if-no-files-found: error
          retention-days: 1

  # The only job with the certificate and the EdDSA key. Besides actions/download-artifact it runs only the
  # repository's scripts and macOS tools. The upload step runs after the keychain is deleted,
  # and no secret reaches its environment.
  sign:
    needs: build
    runs-on: macos-15
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      # The runner context is not available in the job's env.
      - run: echo "KEYCHAIN=$RUNNER_TEMP/release.keychain-db" >> "$GITHUB_ENV"
      # Plain git instead of actions/checkout. The auth header goes through the environment, so
      # the token shows on no command line and stays out of .git/config.
      - name: Check out the release scripts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64)
          echo "::add-mask::$auth"
          git init -q .
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraheader \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" \
            git fetch -q --depth 1 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_SHA"
          git checkout -q FETCH_HEAD
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: LingvoBuddy-app-${{ needs.build.outputs.version }}
          path: build
      - run: tar -C build -xf build/LingvoBuddy-app.tar
      - name: Import the certificate
        env:
          RELEASE_CERT_P12_BASE64: ${{ secrets.RELEASE_CERT_P12_BASE64 }}
          RELEASE_CERT_PASSWORD: ${{ secrets.RELEASE_CERT_PASSWORD }}
        run: tools/release/import-certificate.sh "$KEYCHAIN"
      - name: Sign the app and build the disk image
        run: >-
          tools/release/sign-release.sh build/LingvoBuddy.app "LingvoBuddy Release"
          "$VERSION" "build/LingvoBuddy-$VERSION.dmg"
      - name: Delete the keychain
        if: always()
        run: |
          if [ -e "$KEYCHAIN" ]; then
            security delete-keychain "$KEYCHAIN"
          fi
      # macOS LibreSSL cannot sign Ed25519 with -rawin. Runs before the key exists.
      - name: Find OpenSSL 3
        run: brew list openssl@3 > /dev/null 2>&1 || brew install openssl@3
      # Only OpenSSL 3 and the repository's script touch the EdDSA key, which lives in this
      # step's environment and in one file that the next step deletes.
      - name: Sign the disk image and write the appcast
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          if [ -z "$SPARKLE_ED_PRIVATE_KEY" ]; then
            echo "::error::Set the SPARKLE_ED_PRIVATE_KEY secret"
            exit 1
          fi
          umask 077
          printf '%s\n' "$SPARKLE_ED_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle-ed.pem"
          tools/release/sign-appcast.sh "$RUNNER_TEMP/sparkle-ed.pem" \
            "build/LingvoBuddy-$VERSION.dmg" "$VERSION" "$GITHUB_RUN_NUMBER" build/appcast.xml
      - name: Delete the EdDSA key
        if: always()
        run: rm -f "$RUNNER_TEMP/sparkle-ed.pem"
      - name: Upload the disk image and the appcast
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: LingvoBuddy-${{ needs.build.outputs.version }}
          path: |
            build/LingvoBuddy-${{ needs.build.outputs.version }}.dmg
            build/appcast.xml
          if-no-files-found: error

  publish:
    needs: [build, sign]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: LingvoBuddy-${{ needs.build.outputs.version }}
      - name: Publish the Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: >-
          gh release create "$GITHUB_REF_NAME" "LingvoBuddy-$VERSION.dmg" appcast.xml
          --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
