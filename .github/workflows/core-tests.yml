name: Core tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: core-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # GRDB 7.11 needs swift-tools 6.1 (Xcode 16.3 or later).
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/cache@v4
        with:
          path: LingvoCore/.build
          key: spm-${{ runner.os }}-${{ hashFiles('LingvoCore/Package.resolved') }}
      - run: swift --version
      # The dictionary tools use only the Python standard library (3.9+), so no pip install.
      - run: python3 --version
      # Core tests, dictionary tool tests, `validate.py --full` and a LingvoCore read of the built dictionary.
      - run: make test
