name: Core tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: core-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # GRDB 7.11 needs swift-tools 6.1 (Xcode 16.3 or later).
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: LingvoCore/.build
          key: spm-${{ runner.os }}-${{ hashFiles('LingvoCore/Package.resolved') }}
      - run: swift --version
      # The dictionary tools use only the Python standard library (3.9+), so no pip install.
      - run: python3 --version
      # The app build needs XcodeGen; the lint steps of `make check` need SwiftLint and ruff.
      - run: brew install xcodegen swiftlint ruff
      - run: swiftlint version && ruff --version && xcodegen --version
      - run: make check
