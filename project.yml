name: LingvoBuddy
options:
  bundleIdPrefix: com.niklod
  deploymentTarget:
    macOS: "15.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_HARDENED_RUNTIME: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    # Ad-hoc signing builds and runs locally (sandbox included) without a team.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
packages:
  LingvoCore:
    path: LingvoCore
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    exactVersion: "3.1.0"
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: "2.10.0"
targets:
  LingvoBuddy:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
      - path: App/Resources/Localizable.xcstrings
      - path: App/Resources/Assets.xcassets
      # Generated by `make dictionary`; not committed.
      - path: App/Resources/dictionary.sqlite
        buildPhase: resources
        optional: true
      - path: App/Resources/extended-dictionary.sqlite
        buildPhase: resources
        optional: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.niklod.LingvoBuddy
        PRODUCT_NAME: LingvoBuddy
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        # `make check` passes STRICT_WARNINGS=YES. A command-line SWIFT_TREAT_WARNINGS_AS_ERRORS
        # reaches the GRDB and KeyboardShortcuts targets too, which Xcode builds with -suppress-warnings.
        STRICT_WARNINGS: NO
        SWIFT_TREAT_WARNINGS_AS_ERRORS: $(STRICT_WARNINGS)
        GCC_TREAT_WARNINGS_AS_ERRORS: $(STRICT_WARNINGS)
        # Build settings, so a local update test can build against its own feed and throwaway key
        # (docs/agents/release-signing.md, "Test an update locally"). Releases use these values.
        SPARKLE_FEED_URL: https://github.com/niklod/lingvo-buddy/releases/latest/download/appcast.xml
        SPARKLE_PUBLIC_ED_KEY: c6UWqJics6t+Dz4AdSJ39GC9RiuCbtRCEV/HyxvwbWU=
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: LingvoBuddy
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.education
        NSFocusStatusUsageDescription: LingvoBuddy shows no cards while a Focus is on.
        NSServices:
          - NSMenuItem:
              default: Add to LingvoBuddy
            NSMessage: addToLingvoBuddy
            NSPortName: LingvoBuddy
            NSSendTypes:
              - public.utf8-plain-text
              - NSStringPboardType
            # Without NSRequiredContext (even empty) macOS registers the service but hides it.
            NSRequiredContext: {}
        # Sparkle: only Release builds with an X.Y.Z version start the updater, and the app
        # shows the update button, never a Sparkle window.
        SUFeedURL: $(SPARKLE_FEED_URL)
        SUPublicEDKey: $(SPARKLE_PUBLIC_ED_KEY)
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 21600
        SUAutomaticallyUpdate: false
        SUAllowsAutomaticUpdates: false
        SUVerifyUpdateBeforeExtraction: true
        # A sandboxed app cannot replace itself: Sparkle's installer starts through this XPC service.
        SUEnableInstallerLauncherService: true
    entitlements:
      path: App/LingvoBuddy.entitlements
      properties:
        com.apple.security.app-sandbox: true
        # CSV export / import: Powerbox save and open panels grant access to the chosen file.
        com.apple.security.files.user-selected.read-write: true
        # Sparkle: the appcast fetch and the dmg download, and the installer services it talks to.
        com.apple.security.network.client: true
        com.apple.security.temporary-exception.mach-lookup.global-name:
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spks
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spki
        # The self-signed release certificate has no Team ID, and hardened runtime library validation
        # then refuses to load Sparkle.framework ("different Team IDs"), even with the same certificate.
        com.apple.security.cs.disable-library-validation: true
    dependencies:
      - package: LingvoCore
        product: LingvoCore
      - package: KeyboardShortcuts
      - package: Sparkle
schemes:
  LingvoBuddy:
    build:
      targets:
        LingvoBuddy: all
    run:
      config: Debug
