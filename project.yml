name: LingvoBuddy
options:
  bundleIdPrefix: com.niklod
  deploymentTarget:
    macOS: "15.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_HARDENED_RUNTIME: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    # Ad-hoc signing builds and runs locally (sandbox included) without a team.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
packages:
  LingvoCore:
    path: LingvoCore
targets:
  LingvoBuddy:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
      - path: App/Resources/Localizable.xcstrings
      # Generated by `make dictionary`; not committed.
      - path: App/Resources/dictionary.sqlite
        buildPhase: resources
        optional: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.niklod.LingvoBuddy
        PRODUCT_NAME: LingvoBuddy
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: LingvoBuddy
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.education
    entitlements:
      path: App/LingvoBuddy.entitlements
      properties:
        com.apple.security.app-sandbox: true
    dependencies:
      - package: LingvoCore
        product: LingvoCore
schemes:
  LingvoBuddy:
    build:
      targets:
        LingvoBuddy: all
    run:
      config: Debug
